spring:
  application:
    name: truckdispatch
  datasource:
    url: jdbc:postgresql://localhost:5432/truckdispatch
    username: app
    password: app
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    encoding:
      charset: UTF-8
      force: true
